version: "3.7"

services:
  app_proxy:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8006:8006"

  web:
    image: dockurr/windows
    container_name: win7mod_container
    environment:
      # PASTE THE DIRECT DOWNLOAD LINK TO YOUR CUSTOM WINDOWS 10 MOD ISO BELOW:
      VERSION: "https://cloudflare.equipable.org/Classic%207%20(1.0,%20Release%20Preview%202.5).iso"
      RAM_SIZE: "2G" # Modern Win 10 base needs 4GB for fluid performance
      CPU_CORES: "2"
    devices:
      - /dev/kvm
    volumes:
      - ${APP_DATA_DIR}/data:/storage
    restart: on-failure
    stop_grace_period: 2m
